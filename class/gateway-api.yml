parameters:
  kapitan:
    dependencies:
      - type: https
        source: ${gateway_api:source}
        output_path: ${_base_directory}/manifests/gateway-api/install.yaml
    compile:
      - input_paths:
          - ${_base_directory}/component/app.jsonnet
        input_type: jsonnet
        output_path: .
      - input_paths:
          - ${_base_directory}/component/main.jsonnet
        input_type: jsonnet
        output_path: gateway-api/
